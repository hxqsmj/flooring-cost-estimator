<style>

<body>
<div class="wrap">
<h1>工业地坪造价估算器</h1>
<p class="sub">包工包料参考区间（材料 + 人工 + 机械）。用于前期预算判断，最终价以现场勘测为准。</p>

<div class="card">
  <label>施工面积（㎡）</label>
  <input id="area" type="number" value="1000" min="10" step="10">
  <label>地坪体系</label>
  <select id="system"></select>
  <div class="row">
    <div>
      <label>基层状况</label>
      <select id="base">
        <option value="1">新地面（未做面层）</option>
        <option value="1.12">旧地面，需铣刨/打磨</option>
        <option value="1.25">旧地面，有破损需修补</option>
        <option value="1.4">基层起砂严重 / 需整体处理</option>
      </select>
    </div>
    <div>
      <label>区域类型</label>
      <select id="zone">
        <option value="1">普通生产区</option>
        <option value="1.08">洁净要求（无尘/防静电区）</option>
        <option value="1.06">车辆通行（叉车/货车）</option>
        <option value="1.1">潮湿区 / 冲洗区</option>
      </select>
    </div>
  </div>
  <button onclick="calc()">估算造价</button>
</div>

<div class="card out" id="out">
  <div class="big" id="total">—</div>
  <div class="note">参考总价区间（含税，不含特殊基层处理与夜间施工）</div>
  <table id="detail"></table>
  <div class="cta">
    需要准确报价？<a href="https://jxnh.net/quote" target="_blank" rel="noopener">在线提交询价</a>
    或直接电话 <a href="tel:18606859158">186 0685 9158</a>（24 小时内免费上门勘测）。
  </div>
</div>

</footer>
</div>

<script>
var SYSTEMS = [
  {id:"epoxy-thin",  name:"环氧薄涂（0.5-1mm）",      lo:25,  hi:35,  days:0.03},
  {id:"epoxy-mortar",name:"环氧砂浆（2-3mm）",        lo:45,  hi:70,  days:0.05},
  {id:"self-level",  name:"环氧自流平（2-3mm）",       lo:25,  hi:60,  days:0.05},
  {id:"antistatic",  name:"防静电环氧（2-3mm）",       lo:60,  hi:120, days:0.06},
  {id:"pu-mortar",   name:"聚氨酯砂浆（6-9mm）",       lo:90,  hi:150, days:0.08},
  {id:"carborundum", name:"金刚砂耐磨（3-5mm）",       lo:25,  hi:45,  days:0.04},
  {id:"hardener",    name:"混凝土密封固化剂",           lo:15,  hi:25,  days:0.02},
  {id:"parking",     name:"地下车库地坪（含标线）",     lo:35,  hi:70,  days:0.05}
];
var sel = document.getElementById("system");
SYSTEMS.forEach(function(s){
  var o = document.createElement("option");
  o.value = s.id;
  o.text = s.name + "　" + s.lo + "-" + s.hi + " 元/㎡";
  sel.appendChild(o);
});
sel.value = "self-level";

function fmt(n){ return n.toLocaleString("zh-CN", {maximumFractionDigits:0}); }

function calc(){
  var area = parseFloat(document.getElementById("area").value || "0");
  if(!(area > 0)){ alert("请输入施工面积"); return; }
  var sys = SYSTEMS.find(function(s){ return s.id === document.getElementById("system").value; });
  var k = parseFloat(document.getElementById("base").value) * parseFloat(document.getElementById("zone").value);

  var lo = sys.lo * k, hi = sys.hi * k;
  var totalLo = lo * area, totalHi = hi * area;
  var days = Math.max(2, Math.round(area * sys.days) + 3);

  document.getElementById("total").textContent =
    "¥ " + fmt(lo) + " - " + fmt(hi) + " 元/㎡　｜　合计 " + fmt(totalLo) + " - " + fmt(totalHi) + " 元";

  var rows = [
    ["地坪体系", sys.name],
    ["施工面积", fmt(area) + " ㎡"],
    ["综合单价（含基层系数）", fmt(lo) + " - " + fmt(hi) + " 元/㎡"],
    ["材料约占", Math.round(lo*area*0.55) + " - " + Math.round(hi*area*0.6) + " 元"],
    ["人工机械约占", Math.round(lo*area*0.4) + " - " + Math.round(hi*area*0.45) + " 元"],
    ["预估工期", days + " 天左右（不含养护）"]
  ];
  document.getElementById("detail").innerHTML = rows.map(function(r){
    return "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>";
  }).join("");
  document.getElementById("out").classList.add("show");
}
</script>
</body>
